name: Build & Push Docker Images

on:
  push:
    tags:
      - 'v*.*.*'

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get previous tag
        id: previoustag
        run: |
          # Get the second to last tag (the one before the one just pushed)
          PREV_TAG=$(git tag --sort=-creatordate | sed -n '2p')
          echo "tag=$PREV_TAG" >> $GITHUB_OUTPUT

      - name: Check for modified files
        uses: dorny/paths-filter@v3
        id: changes
        with:
          base: ${{ steps.previoustag.outputs.tag }}
          ref: ${{ github.ref_name }}
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: cd backend && pip install .

      - name: Generate openapi.json
        run: python backend/app/utilities/openapi.py

      - name: Validate alembic migrations
        run: |
          rm -f backend/app/data/db.db
          cd backend && alembic -c app/alembic.ini upgrade head

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase repository name
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Extract Docker metadata for Backend
        if: steps.changes.outputs.backend == 'true'
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO }}-backend
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push backend
        if: steps.changes.outputs.backend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          build-args: ENV=prod
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Retag existing backend image
        if: steps.changes.outputs.backend == 'false'
        run: |
          VERSION=${GITHUB_REF_NAME#v} # Strips the 'v' from 'v1.2.0'
          docker buildx imagetools create ${{ env.REGISTRY }}/${{ env.REPO }}-backend:latest \
            --tag ${{ env.REGISTRY }}/${{ env.REPO }}-backend:$VERSION

      - name: Extract Docker metadata for Frontend
        if: steps.changes.outputs.frontend == 'true'
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO }}-frontend
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push frontend
        if: steps.changes.outputs.frontend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: prod
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
          build-args: |
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}          

      - name: Retag existing frontend image
        if: steps.changes.outputs.frontend == 'false'
        run: |
          VERSION=${GITHUB_REF_NAME#v} # Strips the 'v' from 'v1.2.0'
          docker buildx imagetools create ${{ env.REGISTRY }}/${{ env.REPO }}-frontend:latest \
            --tag ${{ env.REGISTRY }}/${{ env.REPO }}-frontend:$VERSION
