[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-backend"
version = "0.5.0" # x-release-please-version
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    # Core API & Server
    "fastapi==0.136.1",
    "uvicorn[standard]==0.46.0",
    # Database & Migrations
    "SQLAlchemy==2.0.49",
    "alembic==1.18.4",
    # Data Validation & Settings
    "pydantic-settings==2.14.0",
    "python-multipart==0.0.27",
    # Security & Authentication
    "bcrypt==5.0.0",
    "python-jose==3.5.0",
    "cryptography==48.0.0",
    # Utilities
    "fpdf2==2.8.5",
]

[project.optional-dependencies]
dev = [
    "watchfiles==1.1.1",
    "fastapi-cli==0.0.24",
    "pytest",
    "pytest-cov",
    "httpx",
    "ruff",
    "mypy",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = [
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=xml:temp/coverage.xml",
    "-v",
]

[tool.coverage.run]
omit = [
    "addons/*",
    "app/utilities/openapi.py",
]

[tool.ruff]
line-length = 120
exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, undefined names)
    "I",   # isort (import sorting)
    "UP",  # pyupgrade (modernize syntax for Python 3.11+)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.setuptools.packages.find]
where = ["."]

[project.scripts]
seed-db = "app.utilities.seed:main"
